      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0d111b" />
      <stop offset="100%" stop-color="#080b12" />
    </linearGradient>

    <radialGradient id="bg-glow-cyan" cx="15%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bg-glow-purple" cx="85%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Curve & Glow Line Gradients -->
    <linearGradient id="curve-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="area-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
