      <stop offset="50%" stop-color="#0d111b" />
      <stop offset="100%" stop-color="#080b12" />
    </linearGradient>

    <radialGradient id="bg-glow-cyan" cx="15%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
