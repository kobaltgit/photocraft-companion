name: Multi-OS Release & Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Package Windows (Installer & Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build and Package Windows
        shell: pwsh
        run: ./scripts/package_release.ps1

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/*

  build-linux:
    name: Package Linux (DEB & Portable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies for GUI & Tray
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libegl1-mesa-dev libwayland-dev wayland-protocols libfontconfig1-dev libasound2-dev dpkg-dev libclang-dev


      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and Package Linux
        shell: bash
        run: |
          set -e
          set -x
          chmod +x ./scripts/package_release.sh
          ./scripts/package_release.sh




      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*

  build-macos:
    name: Package macOS (DMG & Portable)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and Package macOS
        run: |
          chmod +x ./scripts/package_release.sh
          ./scripts/package_release.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: dist/*

  publish-plugins:
    name: Package & Publish Plugins to Marketplace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Validate & Package Plugins & Build Registry
        run: |
          cargo run --package plugin_validator -- \
            --validate plugins \
            --build-registry \
            --package-plugins

      - name: Publish to GitHub Release 'plugins'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugins
          name: "PhotoCraft Community Plugins Repository"
          body: |
            Automated repository of all community-contributed `.pcpl` plugins and registry index (`registry.json`).
            Installed automatically via PhotoCraft Companion Plugin Manager.
          draft: false
          prerelease: false
          files: |
            dist/*.pcpl
            dist/registry.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos, publish-plugins]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' && needs.build-macos.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built packages
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate Bilingual Release Notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          python3 ./scripts/generate_release_notes.py --version "$VERSION" --output release_notes.md

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          body_path: release_notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
