name: CI & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Code Formatting Check
        run: cargo fmt --all -- --check

      - name: Cargo Check (Workspace)
        run: cargo check --workspace --all-targets -j 1

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets -j 1 -- -D warnings

      - name: Run All Workspace Tests
        run: cargo test --workspace -j 1

      - name: Validate Plugin Ecosystem & Manifests
        run: cargo run --package plugin_validator -j 1 -- --validate plugins

      - name: Build Companion Binary
        run: cargo build --package companion_app --release -j 1

  test-linux:
    name: Build & Test (Ubuntu Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI, Wayland, AppIndicator, GTK3 & Clipboard Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev xvfb

      - name: Cargo Check (Workspace)
        run: cargo check --workspace --all-targets -j 1

      - name: Workspace Tests (Headless Xvfb)
        run: xvfb-run -a cargo test --workspace -j 1
