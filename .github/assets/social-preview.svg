<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow-cyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bg-glow-purple" cx="80%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bg-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0d111b" />
      <stop offset="100%" stop-color="#080b12" />
    </linearGradient>

    <!-- Card and Panel Gradients -->
    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182030" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f1523" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="panel-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Accent & Glow Gradients -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="chip-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5" />
    </linearGradient>

    <!-- Button & Badge Gradients -->
    <linearGradient id="btn-active" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Checkered Pattern for Transparency (Alpha Mask) -->
    <pattern id="checker" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#1e2433" />
      <rect width="6" height="6" fill="#283044" />
      <rect x="6" y="6" width="6" height="6" fill="#283044" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadow-lg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="glow-badge" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.4" />
    </filter>

    <clipPath id="card-clip">
      <rect x="0" y="0" width="460" height="290" rx="16" />
    </clipPath>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1280" height="640" fill="url(#bg-base)" />

  <!-- Ambient Glows -->
  <rect width="1280" height="640" fill="url(#bg-glow-cyan)" />
  <rect width="1280" height="640" fill="url(#bg-glow-purple)" />

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="560" x2="1280" y2="560" />

    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
  </g>

  <!-- ======================================================== -->
  <!-- LEFT COLUMN: Typography, Branding & Features             -->
  <!-- ======================================================== -->

  <g transform="translate(80, 85)">
    <!-- Top Meta Tag / Pill -->
    <g>
      <rect x="0" y="0" width="370" height="34" rx="17" fill="url(#chip-grad)" stroke="url(#chip-border)" stroke-width="1.2" />
      <circle cx="18" cy="17" r="5" fill="#38bdf8" filter="url(#glow-badge)" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#bae6fd" letter-spacing="1.2">
        RUST • 100% NATIVE • OPEN SOURCE
      </text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 75)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="54" fill="#ffffff" letter-spacing="-1.5">
        PhotoCraft
      </text>
      <text x="272" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="54" fill="url(#brand-grad)" letter-spacing="-1.5">
        Companion
      </text>
    </g>

    <!-- Tagline & Description -->
    <g transform="translate(0, 115)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" letter-spacing="-0.3">
        AI-Powered Plugins &amp; Interactive Overlay Palette
      </text>
      <text y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748b">
        Seamless In-Place execution for PhotoCraft editor via JSON-RPC
      </text>
    </g>

    <!-- Feature Pills / Badges (2 rows) -->
    <g transform="translate(0, 200)">
      <!-- Row 1 -->
      <g transform="translate(0, 0)">
        <!-- Badge 1: DirectML GPU -->
        <rect width="168" height="36" rx="10" fill="#131d2e" stroke="#1e293b" stroke-width="1.2" />
        <text x="14" y="23" font-size="14">⚡</text>
        <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">DirectML GPU</text>

        <!-- Badge 2: In-Place AI -->
        <rect x="178" width="176" height="36" rx="10" fill="#131d2e" stroke="#1e293b" stroke-width="1.2" />
        <text x="192" y="23" font-size="14">✂️</text>
        <text x="214" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">In-Place Remove BG</text>

        <!-- Badge 3: egui Floating UI -->
        <rect x="364" width="158" height="36" rx="10" fill="#131d2e" stroke="#1e293b" stroke-width="1.2" />
        <text x="378" y="23" font-size="14">🎛️</text>
        <text x="400" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">egui Toolstrip</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 48)">
        <!-- Badge 4: .pcpl Packages -->
        <rect width="148" height="36" rx="10" fill="#131d2e" stroke="#1e293b" stroke-width="1.2" />
        <text x="14" y="23" font-size="14">📦</text>
        <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">.pcpl Packages</text>

        <!-- Badge 5: Global Hotkeys -->
        <rect x="158" width="162" height="36" rx="10" fill="#131d2e" stroke="#1e293b" stroke-width="1.2" />
        <text x="172" y="23" font-size="14">⌨️</text>
        <text x="194" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Global Hotkeys</text>

        <!-- Badge 6: Zero Dependencies -->
        <rect x="330" width="160" height="36" rx="10" fill="#131d2e" stroke="#1e293b" stroke-width="1.2" />
        <text x="344" y="23" font-size="14">🦀</text>
        <text x="366" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Cargo Workspace</text>
      </g>
    </g>

    <!-- Bottom Platform & Telemetry Bar -->
    <g transform="translate(0, 375)">
      <rect width="520" height="52" rx="14" fill="#0d1424" stroke="#1e293b" stroke-width="1" />
      
      <!-- OS Support Icons -->
      <g transform="translate(20, 16)">
        <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="0.5">MULTI-PLATFORM:</text>
        <text x="140" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Windows • Linux • macOS</text>
      </g>
      
      <!-- Release Version Tag -->
      <g transform="translate(425, 12)">
        <rect width="78" height="28" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="16" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#38bdf8">v0.1.0</text>
      </g>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- RIGHT COLUMN: Interactive Visual Mockup / Hero Graphic   -->
  <!-- ======================================================== -->

  <g transform="translate(730, 75)" filter="url(#shadow-lg)">
    <!-- Main Window / Canvas Preview -->
    <g>
      <!-- Glass Card Outer -->
      <rect width="470" height="310" rx="18" fill="url(#panel-bg)" stroke="url(#panel-border)" stroke-width="1.5" />

      <!-- Window Titlebar -->
      <g transform="translate(18, 16)">
        <!-- Window Dots -->
        <circle cx="8" cy="8" r="5" fill="#ef4444" opacity="0.8" />
        <circle cx="26" cy="8" r="5" fill="#f59e0b" opacity="0.8" />
        <circle cx="44" cy="8" r="5" fill="#10b981" opacity="0.8" />

        <!-- Title & Socket Status -->
        <text x="64" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
          PhotoCraft Active Canvas — 8256 × 4608
        </text>

        <g transform="translate(325, 0)">
          <circle cx="6" cy="8" r="4" fill="#10b981" />
          <text x="16" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#34d399">18492 OK</text>
        </g>
      </g>

      <!-- Canvas Content Preview (Before & After Split View) -->
      <g transform="translate(16, 42)" clip-path="url(#card-clip)">
        <!-- Left Side: Original Image Fill -->
        <rect width="438" height="252" rx="12" fill="#111827" />

        <!-- Right Side: Checkered Alpha Channel (Cutout Preview) -->
        <rect x="220" width="218" height="252" fill="url(#checker)" />

        <!-- Dynamic Silhouette Artwork (Human Portrait with Neon Lines) -->
        <g transform="translate(120, 25)">
          <!-- Abstract Subject Silhouette -->
          <path d="M 100 45 C 75 45 60 70 60 105 C 60 145 75 165 90 175 C 65 190 35 210 25 240 L 175 240 C 165 210 135 190 110 175 C 125 165 140 145 140 105 C 140 70 125 45 100 45 Z" fill="#334155" opacity="0.9" />
          
          <!-- Neon Accent Cyber Circuit on Cutout -->
          <path d="M 100 80 L 115 110 L 105 130 L 125 160" stroke="#00f2fe" stroke-width="3" fill="none" stroke-linecap="round" />
          <circle cx="115" cy="110" r="3.5" fill="#38bdf8" />
          <circle cx="125" cy="160" r="3.5" fill="#38bdf8" />

          <path d="M 90 95 L 80 120 L 90 140" stroke="#818cf8" stroke-width="2.5" fill="none" stroke-linecap="round" />
        </g>

        <!-- Vertical Comparison Divider / Laser Scan Line -->
        <line x1="220" y1="0" x2="220" y2="252" stroke="#38bdf8" stroke-width="2.5" />
        
        <!-- Center Slider Handle -->
        <circle cx="220" cy="126" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
        <path d="M 215 126 L 218 123 M 215 126 L 218 129 M 225 126 L 222 123 M 225 126 L 222 129" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

        <!-- Split Labels -->
        <rect x="15" y="15" width="84" height="24" rx="6" fill="#090d16" opacity="0.8" />
        <text x="24" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#94a3b8">ORIGINAL</text>

        <rect x="330" y="15" width="94" height="24" rx="6" fill="#0284c7" opacity="0.9" />
        <text x="339" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#ffffff">AI CUTOUT</text>

        <!-- In-Place Toast Notification Badge -->
        <g transform="translate(110, 205)">
          <rect width="220" height="34" rx="8" fill="#0f172acc" stroke="#38bdf8" stroke-width="1" />
          <circle cx="18" cy="17" r="4.5" fill="#10b981" />
          <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">
            Layer: Background (No BG)
          </text>
        </g>
      </g>
    </g>

    <!-- ======================================================== -->
    <!-- FLOATING PALETTE / TOOLSTRIP OVERLAY                     -->
    <!-- Two-Tier Compact egui Toolbar (as implemented in crates) -->
    <!-- ======================================================== -->
    <g transform="translate(45, 275)" filter="url(#shadow-lg)">
      <!-- Outer Toolstrip Frame -->
      <rect width="380" height="78" rx="14" fill="#141a29" stroke="#38bdf8" stroke-width="1.8" />

      <!-- Top Tier: Utility Handles & Controls -->
      <g transform="translate(14, 12)">
        <!-- Grip Dots (Draggable Handle) -->
        <g fill="#475569">
          <circle cx="4" cy="4" r="1.8" />
          <circle cx="4" cy="11" r="1.8" />
          <circle cx="10" cy="4" r="1.8" />
          <circle cx="10" cy="11" r="1.8" />
        </g>

        <!-- Mode Label -->
        <text x="24" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#64748b" letter-spacing="1">
          TOOLSTRIP • TWO-TIER
        </text>

        <!-- Utility Buttons (Orientation, Settings, Minimize) -->
        <g transform="translate(290, -2)">
          <!-- Orientation Button ⇄ -->
          <rect width="18" height="18" rx="4" fill="#1e293b" />
          <text x="4" y="13" font-size="11" fill="#94a3b8">⇄</text>

          <!-- Settings Button ⚙ -->
          <rect x="24" width="18" height="18" rx="4" fill="#1e293b" />
          <text x="28" y="13" font-size="11" fill="#94a3b8">⚙</text>

          <!-- Tray Button 🗕 -->
          <rect x="48" width="18" height="18" rx="4" fill="#1e293b" />
          <text x="53" y="12" font-size="10" fill="#94a3b8">−</text>
        </g>
      </g>

      <!-- Bottom Tier: Plugin Action Buttons -->
      <g transform="translate(14, 34)">
        <!-- Button 1: Remove Background (Active Primary Action) -->
        <g>
          <rect width="135" height="34" rx="8" fill="url(#btn-active)" stroke="#60a5fa" stroke-width="1.2" />
          <text x="12" y="22" font-size="14">✂️</text>
          <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#ffffff">
            Remove BG
          </text>
        </g>

        <!-- Button 2: Black & White Macro -->
        <g transform="translate(145, 0)">
          <rect width="70" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="10" y="22" font-size="13">🌓</text>
          <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">BW</text>
        </g>

        <!-- Button 3: Copy Merged -->
        <g transform="translate(225, 0)">
          <rect width="70" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="10" y="22" font-size="13">📋</text>
          <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">Copy</text>
        </g>

        <!-- Button 4: Add New Plugin (+) -->
        <g transform="translate(305, 0)">
          <rect width="42" height="34" rx="8" fill="#182234" stroke="#2563eb" stroke-dasharray="3 3" stroke-width="1" />
          <text x="15" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#38bdf8">+</text>
        </g>
      </g>
    </g>

    <!-- Speed & Inference Telemetry Pill -->
    <g transform="translate(130, 395)">
      <rect width="210" height="36" rx="10" fill="#0b111ecc" stroke="#818cf8" stroke-width="1.2" />
      <text x="14" y="23" font-size="13">⚡</text>
      <text x="32" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#c7d2fe">
        RMBG-1.4: 2.24s (DirectML)
      </text>
    </g>
  </g>

  <!-- Decorative Corner Accents -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.4" fill="none">
    <path d="M 25 45 L 25 25 L 45 25" />
    <path d="M 1255 45 L 1255 25 L 1235 25" />
    <path d="M 25 595 L 25 615 L 45 615" />
    <path d="M 1255 595 L 1255 615 L 1235 615" />
  </g>
</svg>
