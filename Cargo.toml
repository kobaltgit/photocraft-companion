[workspace]
resolver = "2"
members = [
    "crates/core_contracts",
    "crates/photocraft_bridge",
    "crates/ai_engine",
    "crates/overlay_ui",
    "crates/companion_app",
    "crates/plugin_validator",
]

[workspace.package]
version = "1.0.3"
edition = "2021"
authors = ["kobaltGIT"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kobaltgit/photocraft-companion"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
anyhow = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
arboard = "3.4"
ort = { version = "2.0.0-rc.13" }
ndarray = "0.17"
async-trait = "0.1"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "links"] }
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
tray-icon = "0.26.1"
resvg = "0.48"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
rfd = "0.15"
vtracer = "0.6.5"

[profile.dev]
opt-level = 0
debug = 1
codegen-units = 1
incremental = false

[profile.test]
opt-level = 0
debug = 1
codegen-units = 1
incremental = false

[profile.release]
opt-level = 2
codegen-units = 1
lto = false
debug = false
panic = "abort"
