[workspace]
resolver = "2"
members = [
    "crates/core_contracts",
    "crates/photocraft_bridge",
    "crates/ai_engine",
    "crates/overlay_ui",
    "crates/hotkey_service",
    "crates/companion_app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["kobaltGIT"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kobaltgit/photocraft-plugins"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
anyhow = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
arboard = "3.4"
ort = { version = "2.0.0-rc.13", features = ["directml"] }
ndarray = "0.17"
global-hotkey = "0.8.0"
async-trait = "0.1"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
tray-icon = "0.26.1"
resvg = "0.48"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
rfd = "0.15"

[profile.release]
opt-level = 2
codegen-units = 8
lto = false
debug = false
panic = "abort"
